spring.application.name=budgetinAI

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Provedor padrão: 'openai' ou 'ollama'

app.ai.provider=ollama

# Configurações Ollama (quando app.ai.provider=ollama)
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=llama3:latest
spring.ai.ollama.chat.temperature=0.7

# Configurações OpenAI (quando app.ai.provider=openai)
spring.ai.openai.api-key=${OPENAI_API_KEY:dummy-key-for-local-ollama}
spring.ai.openai.chat.model=gpt-4o-mini
spring.ai.openai.chat.temperature=0.8
#spring.ai.openai.chat.response-format = TEXT
logging.level.org.springframework.ai = DEBUG

spring.ai.openai.audio.transcription.model=whisper-1
spring.ai.openai.audio.transcription.language=pt
spring.ai.openai.audio.transcription.temperature=0
spring.ai.openai.audio.transcription.response-format=text
spring.ai.openai.audio.transcription.prompt=Áudio em português brasileiro.\
  Áudio contém descrição de gastos financeiros. \
  As frases geralmente contêm: \
  - um valor em reais (número + "reais"); \
  - uma ação (gastei, paguei, comprei); \
  - um local ou estabelecimento (mercado, farmácia, restaurante, loja, etc.).


spring.ai.model.audio.speech=openai
spring.ai.openai.audio.speech.model=gpt-4o-mini-tts
spring.ai.openai.audio.speech.voice=nova
spring.ai.openai.audio.speech.speed=1.2
spring.ai.openai.audio.speech.response-format=mp3
